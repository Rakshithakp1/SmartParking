
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - Smart Parking</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #102542, #176b87);
        }

        .login-box {
            background: white;
            width: 380px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px #00000040;
        }

        h2 {
            text-align: center;
            color: #102542;
        }

        p {
            text-align: center;
            color: #64748b;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 12px 0;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #087eaa;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #102542;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #087eaa;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>🚗 Customer Login</h2>
        <p>Welcome to Smart Parking System</p>

        <form action="login" method="post">

            <input type="email"
                   name="email"
                   placeholder="Enter Email"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   required>

            <button type="submit">Login</button>

        </form>

        <a href="index.html" class="back">← Back to Home</a>

    </div>

</body>
</html>
