
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parking - Parking Slots</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef4f7;
            text-align: center;
        }

        header {
            background: #073b4c;
            color: white;
            padding: 20px;
        }

        .container {
            padding: 30px;
        }

        .slots {
            display: grid;
            grid-template-columns: repeat(4, 130px);
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .slot {
            padding: 25px 10px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            background: #06a77d;
            cursor: pointer;
        }

        .occupied {
            background: #e63946;
            cursor: not-allowed;
        }

        .selected {
            background: #073b4c;
            outline: 4px solid #ffd166;
        }

        button {
            padding: 12px 25px;
            background: #073b4c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 25px;
        }

        button:hover {
            background: #087e8b;
        }

        @media(max-width: 600px) {
            .slots {
                grid-template-columns: repeat(2, 130px);
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Smart Parking Management System</h1>
    <p>Check Available Parking Slots</p>
</header>

<div class="container">

    <h2>Parking Slot Status</h2>

    <p>
        <span style="color:green;">🟢 Available</span>
        &nbsp;&nbsp;
        <span style="color:red;">🔴 Occupied</span>
    </p>

    <div class="slots" id="slots">
        Loading parking slots...
    </div>

    <h3 id="selected">Please select an available slot</h3>

    <button onclick="bookSlot()">Book Selected Slot</button>

    <p>
        <a href="customer-dashboard.html">Back to Dashboard</a>
    </p>

</div>

<script>

let selectedSlot = null;

// Load parking slots from database
async function loadSlots() {

    try {

        const response = await fetch("slots");

        if (!response.ok) {
            throw new Error("Unable to load slots");
        }

        const data = await response.json();

        const container = document.getElementById("slots");
        container.innerHTML = "";

        data.forEach(slot => {

            const div = document.createElement("div");
            div.className = "slot";

            const status = slot.status.toUpperCase();

            div.innerHTML =
                "Slot " + slot.slot_no + "<br>" + status;

            if (status === "BOOKED" || status === "OCCUPIED") {

                div.classList.add("occupied");

            } else {

                div.onclick = function() {
                    selectSlot(slot.slot_no, div);
                };

            }

            container.appendChild(div);

        });

    } catch (error) {

        document.getElementById("slots").innerText =
            "Unable to load parking slots. Please try again.";

    }
}


// Select available slot
function selectSlot(number, element) {

    selectedSlot = number;

    document.querySelectorAll(".slot").forEach(slot => {
        slot.classList.remove("selected");
    });

    element.classList.add("selected");

    document.getElementById("selected").innerText =
        "Selected Parking Slot: " + number;
}


// Navigate to booking page
function bookSlot() {

    if (selectedSlot === null) {

        alert("Please select an available slot!");

    } else {

        window.location.href =
            "booking.html?slot=" + selectedSlot;

    }

}


// Load slots when page opens
loadSlots();

</script>

</body>
</html>
