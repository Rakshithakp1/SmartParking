<!DOCTYPE html>
<html>
<head>
    <title>Smart Parking - Payment</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #071b33, #087e8b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .payment-box {
            background: white;
            width: 380px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0005;
        }

        h2 {
            text-align: center;
            color: #087e8b;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #087e8b;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #05636d;
        }

        p {
            text-align: center;
        }
    </style>
</head>
<body>

<div class="payment-box">
    <h2>Parking Payment</h2>

    <form action="payment" method="post">

        <input type="number"
               name="bookingId"
               placeholder="Booking ID"
               min="1"
               required>

        <input type="number"
               name="amount"
               placeholder="Amount (₹)"
               min="1"
               step="0.01"
               required>

        <select name="paymentMethod" required>
            <option value="">Select Payment Method</option>
            <option value="UPI">UPI</option>
            <option value="Card">Debit / Credit Card</option>
            <option value="Cash">Cash</option>
        </select>

        <button type="submit">Pay Now</button>
    </form>

    <p><a href="booking.html">Back to Booking</a></p>
    <p><a href="customer-dashboard.html">Back to Dashboard</a></p>
    <p><a href="index.html">Back to Home</a></p>
</div>

</body>
</html>
